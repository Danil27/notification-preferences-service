services:
  postgres:
    image: postgres:16-alpine
    container_name: notification_preferences_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-notification_preferences}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-notification_preferences}
      POSTGRES_DB: ${DATABASE_NAME:-notification_preferences}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DATABASE_USER:-notification_preferences} -d ${DATABASE_NAME:-notification_preferences}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
