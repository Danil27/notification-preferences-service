services:
  postgres:
    image: postgres:16-alpine
    container_name: notification_preferences_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notification_preferences}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notification_preferences}
      POSTGRES_DB: ${POSTGRES_DB:-notification_preferences}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-notification_preferences} -d ${POSTGRES_DB:-notification_preferences}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
